<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deutschland-Uhr</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page page-clock">
  <main class="clock-shell">
    <section id="clockCard" class="clock-card">
      <div class="clock-label">Aktuelle Uhrzeit in Deutschland</div>
      <div id="time" class="clock-time">--:--:--</div>
      <div id="date" class="clock-date">--</div>
    </section>

    <button id="backBtn" class="back-btn" type="button" aria-label="Zur Konfiguration zurück">Konfiguration</button>
    <button id="fullscreenBtn" class="fullscreen-btn" type="button" aria-label="Vollbild aktivieren">⛶</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
